function mult(G,k){let m=1;G.team.forEach(id=>{const f=ADV[id].fx[k];if(f)m*=f});const pf=CANDS[G.side].fx[k];if(pf)m*=pf;return m}

function newGame(side,diff){
  const b=CANDS[side];

  const rivals=RIVALS[side].map(r=>Object.assign({},r,{accents:r.accents.slice(),mo:0,del:0,out:false}));
  return {side,opSide:side==='D'?'R':'D',diff,phase:'setup',me,rivals,stats:Object.assign({},b.stats),funds:b.funds,team:[],stageIdx:0,unity:0,needHire:false,
    ui:{acc:[],pos:50,hire:[]},plan:{tone:0,tactics:[]},estNoise:{},lastRes:null,convOut:null,vp:null,vpDeal:null,debates:[],stat:{ads:0,field:0,rally:0},stateRes:{},stageDel:{}};

function setupPrimaries(G,o){

}
function activeCands(G){return [G.me].concat(G.rivals.filter(r=>!r.out))}

}
function beginPlan(G){
  G.plan={tone:0,tactics:[],theme:null,region:null,target:null};G.estNoise={};
  activeCands(G).forEach(c=>G.estNoise[c.id]=gauss()*.55*(c.isMe&&G.team.includes('strategist')?.6:1));
}
function baseScore(G,c,st){
  const party=PARTIES[G.side];
  const posFit=1-Math.abs(c.pos-st.ep)/60;
  let fit=0;c.accents.forEach(a=>{fit+=(party.base[a]||0)*(st.hot.includes(a)?1.5:1)});fit/=3;
  let s=2.4*posFit+2.2*fit+.12*c.charisma+.9*c.mo+(c.home===st.id?.6:0);
  if(c.isMe&&G.team.includes('strategist'))s+=.35*fit;
  if(!c.isMe)s+=DIFF[G.diff].riv;
  return s;
}
const softShares=sc=>{const T=1.5,ex=sc.map(s=>Math.exp(s/T)),t=sum(ex);return ex.map(e=>e/t)};
const threshold=sh=>{const r=sh.map(v=>v<.15?0:v),t=sum(r);return t===0?sh:r.map(v=>v/t)};
function allocate(sh,total){
  const raw=sh.map(s=>s*total),fl=raw.map(Math.floor);let rem=total-sum(fl);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){fl[i]++;rem--}});
  return fl;
}
function estimate(G){

  const sh=threshold(softShares(cs.map(c=>baseScore(G,c,st)+(G.estNoise[c.id]||0))));
  return cs.map((c,i)=>({c,share:sh[i]}));
}
function planCost(G){return sum(G.plan.tactics.map(k=>TACT[k].cost))+(G.plan.region?REG_COST:0)}
function resolveStage(G){
  const st=STAGES[G.stageIdx],plan=G.plan,notes=[];
  G.me.pos=clamp(G.me.pos+plan.tone*8,5,95);
  const tc=plan.tactics.slice(0,2);
  const regCost=plan.region?REG_COST:0;
  G.funds-=sum(tc.map(k=>TACT[k].cost))+regCost;
  tc.forEach(k=>{if(k==='ads')G.stat.ads++;if(k==='ground')G.stat.field++;if(k==='rally')G.stat.rally++});
  const cs=activeCands(G),bonus={};cs.forEach(c=>bonus[c.id]=0);
  const others=cs.filter(c=>!c.isMe);
  const rank=c=>c.del+c.mo*20;
  const leader=others.slice().sort((a,b)=>rank(b)-rank(a))[0];
  const tgt=others.find(r=>r.id===plan.target)||leader;
  tc.forEach(k=>{
    if(k==='attack'){
      if(tgt){bonus[tgt.id]-=.9;G.unity-=.25;
        if(Math.random()<.25*mult(G,'crisis')+.1){bonus.me-=.5;notes.push('Негативная кампания обернулась против вас: избиратели устали от грязи.')}
        else notes.push('Ваша атака на '+tgt.name+' попала в цель.');}
    }else if(k==='oppo'){
      if(tgt){
        if(Math.random()<.65){bonus[tgt.id]-=1.1;notes.push('Досье на '+tgt.name+' сработало: пресса обсуждает его прошлое.')}
        else{bonus.me-=.3*mult(G,'crisis');notes.push('Досье на '+tgt.name+' оказалось пустышкой, а утечка ударила по вам.')}
      }
    }else if(k==='fund'){
      const g=7*mult(G,'fundraise');G.funds+=g;notes.push('Сбор средств принёс '+money(g)+'.');
    }else if(k==='debate'){
      const e=((G.stats.charisma+G.stats.policy)/2-6.5)*.3+gauss()*.7;
      const v=clamp(e,-.8,1.3)*XW[st.id].debate;
      bonus.me+=v>0?v*mult(G,'debate'):v;
      notes.push(v>.5?'Вы убедительно выступили на теледебатах.':v>0?'Дебаты прошли ровно, вы чуть опередили соперников.':'Дебаты прошли неудачно: вы выглядели неуверенно.');
    }else if(k==='endorse'){
      bonus.me+=TACT.endorse.v*XW[st.id].endorse;
      notes.push(pick(['Вас поддержали местные профсоюзы.','За вас высказался влиятельный губернатор.','Крупная общественная организация выступила в вашу пользу.']));
    }else bonus.me+=TACT[k].v*st.w[k]*mult(G,k);
  });
  if(plan.theme){
    bonus.me+=themeBonus(G,G.me,plan.theme,st)*mult(G,'accent');
    notes.push('Тема этапа «'+ISSUES[plan.theme]+'» '+(st.hot.indexOf(plan.theme)>=0?'попала в повестку избирателей.':'вызвала умеренный интерес.'));
  }
  if(plan.region){
    const e=regionEffect(st.id,plan.region);bonus.me+=e;
    notes.push('Региональный акцент: '+RN[plan.region]+(e>0?'. Расчёт оправдался.':'. Для этого этапа регион был слишком мал.'));
  }
  others.forEach(r=>{
    let eff=0;
    shuffle(['ads','ground','rally']).slice(0,2).forEach(k=>{const t=TACT[k];if(r.money>=t.cost){r.money-=t.cost;eff+=t.v*st.w[k]}});
    bonus[r.id]+=eff*.85;
    bonus[r.id]+=Math.max.apply(null,r.accents.map(a=>themeBonus(G,r,a,st)))*.9;
    if(r.money>=5&&Math.random()<.28){
      const tg=cs.filter(c=>c.id!==r.id).sort((a,b)=>rank(b)-rank(a))[0];
      if(tg){r.money-=5;bonus[tg.id]-=.8;if(tg.isMe)notes.push(r.name+' запустил против вас негативную рекламу.')}
    }
  });
  const sc=cs.map(c=>baseScore(G,c,st)+bonus[c.id]+gauss()*.45);
  const sh=threshold(softShares(sc));
  const dels=allocate(sh,st.del);
  const rows=cs.map((c,i)=>{c.del+=dels[i];return {c,share:sh[i],got:dels[i]}});
  rows.forEach(r=>{r.c.mo=clamp(.5*r.c.mo+(r.share-1/cs.length)*2.4,-1.5,1.5)});
  const mine=rows.find(r=>r.c.isMe);
  const inc=(4+mine.share*12)*mult(G,'income');
  G.funds+=inc;
  others.forEach(r=>{const row=rows.find(x=>x.c===r);r.money+=4+row.share*10});
  const winner=rows.slice().sort((a,b)=>b.share-a.share)[0];
  notes.unshift(winner.c.isMe?'Вы выигрываете этап.':winner.c.name+' выигрывает этап.');
  const total=sum(activeAll(G).map(c=>c.del));
  if(G.stageIdx>=2){
    G.rivals.forEach(r=>{
      if(!r.out&&r.del/total<.14){
        r.out=true;notes.push(r.name+' снимает кандидатуру.');
        const rem=activeCands(G).sort((a,b)=>Math.abs(a.pos-r.pos)-Math.abs(b.pos-r.pos))[0];
        if(rem){rem.mo=clamp(rem.mo+.5,-1.5,1.5);if(rem.isMe)notes.push('Сторонники '+r.name+' переходят к вам.')}
      }
    });
  }
  const sres={};
  STATES.forEach(s=>{
    if(stageOf(s.code)!==st.id)return;
    let bi=0,bv=-9;cs.forEach((c,i)=>{const v=sh[i]+gauss()*.07;if(v>bv){bv=v;bi=i}});

  });

  G.stageDel=G.stageDel||{};G.stageDel[st.id]=rows.map(r=>({id:r.c.id,got:r.got}));
  G.lastRes={stage:st,rows:rows.map(r=>({c:r.c,share:r.share,got:r.got,cum:r.c.del})),notes,inc,spent:sum(tc.map(k=>TACT[k].cost))+regCost,total};
  G.stageIdx++;

  G.phase='stageRes';
  return G.lastRes;
}

/* ---- съезд ---- */
function convStatus(G){
  const all=activeAll(G),total=sum(all.map(c=>c.del)),maj=Math.floor(total/2)+1;
  const rivals=G.rivals.slice().sort((a,b)=>b.del-a.del);
  const best=rivals[0];
  const kind=G.me.del>=maj?'majority':G.me.del>best.del?'lead':'trail';
  return {total,maj,kind,best,second:rivals[1]};
}
function adoptAccent(G,rv){
  const party=PARTIES[G.side];
  const cand=rv.accents.find(a=>!G.me.accents.includes(a));
  if(!cand)return;
  const weakest=G.me.accents.slice().sort((a,b)=>(party.base[a]||0)-(party.base[b]||0))[0];
  G.me.accents[G.me.accents.indexOf(weakest)]=cand;
}
function convChance(G,key){
  if(key==='fight')return clamp(.3+.1*G.me.mo,.15,.5);
  if(key==='deal')return .6;
  return 1;
}
function convChoose(G,key){
  const cs=convStatus(G);let ok=true,text='';
  const rv=cs.best;
  if(cs.kind==='majority'){G.unity+=.4;text='Вы набираете большинство делегатов в первом туре голосования. Съезд превращается в коронацию.'}
  else if(cs.kind==='lead'){
    if(key==='dealvp'){G.unity+=.5;G.vpDeal=rv;text='Вы обещаете вице-президентство '+rv.name+'. Её делегаты голосуют за вас.'}
    else if(key==='dealplat'){G.unity+=.3;G.me.pos=clamp(G.me.pos+Math.sign(rv.pos-G.me.pos)*8,5,95);adoptAccent(G,rv);text='Вы включаете в платформу предложения '+rv.name+'. Партия объединяется, но ваш образ немного смещается.'}
    else{G.unity-=.5;text='Вы идёте до конца и побеждаете, но на съезде остаётся обида.'}
  }else{
    if(Math.random()<convChance(G,key)){
      if(key==='fight'){G.unity-=.6;text='Вы выигрываете борьбу за делегатов кулуарами. Победа есть, но партия расколота.'}
      else{G.unity-=.2;G.me.pos=clamp(G.me.pos+Math.sign(rv.pos-G.me.pos)*10,5,95);adoptAccent(G,rv);text='Сделка работает: вы принимаете главные условия '+rv.name+' и выходите на первое место.'}
    }else{ok=false;text=key==='fight'?'Делегаты не поддаются. Номинацию получает '+rv.name+'.':'Сделка срывается: переговорщики не договорились. Номинацию получает '+rv.name+'.'}
  }

}

function accentAdj(G,s){

}
function vpAdj(G,s){

}

  {id:'track',n:'Заказной опрос вашего штаба',s:'Заказной опрос',sd:2.0,lag:0,cov:0,note:'Свежий опрос, заказанный вами.'}
];
const SRCB={};SRC.forEach(r=>SRCB[r.id]=r);
function pollValue(G,s,r,cur,prev){
  const base=(r.lag&&prev!=null)?(1-r.lag)*cur+r.lag*prev:cur;
  const sd=r.sd*((r.id==='mine'||r.id==='track')?mult(G,'poll'):1)*(1+(s.ev<6?.35:0));
  return base+G.pollBias+G.regBias[s.region]*.7+G.house[r.id]+gauss()*sd;
}
function pollsRefresh(G){
  const first=G.week===1,prev=G.prevM,cur={};
  STATES.forEach(s=>{
    const m=margin(G,s);cur[s.code]=m;
    SRC.forEach(r=>{
      if(r.id==='track')return;
      let p=clamp(r.cov*(.55+.45*Math.exp(-Math.abs(m)/12))+s.ev*.012,.12,.95);
      if(r.id==='opp')p*=(m<3?1.5:.4);
      if(first)p=Math.min(.95,p+.25);
      if(Math.random()<p)G.polls[r.id][s.code]={v:pollValue(G,s,r,m,prev?prev[s.code]:null),w:G.week};
    });
  });
  G.prevM=cur;
}
function pollsFor(G,code){
  const out=[];
  SRC.forEach(r=>{const p=G.polls[r.id][code];if(p)out.push({r,v:p.v,age:G.week-p.w})});
  return out.sort((a,b)=>a.age-b.age);
}
function aggOf(G,s){
  const it=pollsFor(G,s.code);if(!it.length)return null;
  let ws=0,sv=0,age=99;
  it.forEach(x=>{
    const sd=x.r.sd*((x.r.id==='mine'||x.r.id==='track')?mult(G,'poll'):1);
    const w=Math.exp(-x.age/3)/(sd*sd);ws+=w;sv+=w*x.v;age=Math.min(age,x.age);
  });
  const fr=it.filter(x=>x.age<=3),v=sv/ws;
  const lo=fr.length?Math.min.apply(null,fr.map(x=>x.v)):v,hi=fr.length?Math.max.apply(null,fr.map(x=>x.v)):v;
  return {v,age,n:it.length,lo,hi,dis:fr.length>1&&hi-lo>=6,items:it};
}
function viewVal(G,s,src){
  if(src==='avg')return aggOf(G,s);
  const p=G.polls[src][s.code];
  return p?{v:p.v,age:G.week-p.w,dis:false}:null;
}
const pollOf=(G,s)=>{const a=aggOf(G,s);return a?a.v:0};
function tierOf(G,p){
  const a=Math.abs(p);if(a<3)return 't0';
  const party=(p>0?G.side:G.opSide).toLowerCase();
  return party+(a<6?1:a<12?2:3);
}
function projection(G,src){
  src=src||'avg';let me=0,op=0,toss=0,unk=0;
  STATES.forEach(s=>{const a=viewVal(G,s,src);if(!a){unk+=s.ev;return}if(a.v>=3)me+=s.ev;else if(a.v<=-3)op+=s.ev;else toss+=s.ev});
  return {me,op,toss,unk};
}
function finalPollRows(G){
  return [{id:'avg',n:'Среднее по опросам'}].concat(SRC.filter(r=>r.id!=='track')).map(r=>{const p=projection(G,r.id);return {n:r.n,me:p.me,op:p.op,q:p.toss+p.unk}});
}
function suggest(G){
  return STATES.map(s=>{const a=aggOf(G,s);return {s,w:s.ev*Math.exp(-Math.abs(a?a.v:0)/5)}}).sort((a,b)=>b.w-a.w).slice(0,4).map(x=>x.s);
}
const adCost=s=>2.5+s.ev*.45;
const COST={rally:1.5,field:3.5,attack:8,speech:.5,track:1.2};
const fail=m=>({ok:false,msg:m});
function say(G,t){G.weekLog.push(t)}

function actAd(G,code){
  const s=S[code],c=adCost(s);if(G.funds<c)return fail('Не хватает средств.');
  const x=G.st[code];G.funds-=c;
  x.ad=Math.min(6,x.ad+2*mult(G,'ads')/(1+x.ad*.25));G.stat.ads++;
  const m='Реклама в штате '+s.name+'.';say(G,m);return {ok:true,msg:m};
}
function actRally(G,code){
  const s=S[code];if(G.ap<1)return fail('Нет свободных дней.');if(G.funds<COST.rally)return fail('Не хватает средств.');
  const x=G.st[code];G.ap--;G.funds-=COST.rally;
  const k=mult(G,'rally')/(1+x.rallies*.5);
  x.persist=Math.min(6,x.persist+.7*k);x.ad=Math.min(6,x.ad+1.5*k);x.rallies++;
  STATES.forEach(o=>{if(o.region===s.region&&o.code!==code)G.st[o.code].persist=Math.min(6,G.st[o.code].persist+.12*k)});
  G.stat.rally++;
  const m='Митинг в штате '+s.name+'.';say(G,m);return {ok:true,msg:m};
}
function actField(G,code){
  const s=S[code],x=G.st[code];
  if(x.ground>=3)return fail('Штаб уже на максимуме.');if(G.funds<COST.field)return fail('Не хватает средств.');
  G.funds-=COST.field;x.ground++;G.stat.field++;
  const m='Новый штаб в штате '+s.name+' (уровень '+x.ground+').';say(G,m);return {ok:true,msg:m};
}
function actFund(G){
  if(G.ap<1)return fail('Нет свободных дней.');if(G.fundraised>=2)return fail('Доноры устали: два сбора в неделю максимум.');
  const g=8*mult(G,'fundraise')*(G.fundraised?.6:1);G.ap--;G.funds+=g;G.fundraised++;
  const m='Сбор средств принёс '+money(g)+'.';say(G,m);return {ok:true,msg:m};
}
function actSpeech(G,issue){
  if(G.ap<1)return fail('Нет свободных дней.');if(G.funds<COST.speech)return fail('Не хватает средств.');
  G.ap--;G.funds-=COST.speech;
  STATES.forEach(s=>{if(s.issues.includes(issue)){const x=G.st[s.code];x.ad=Math.min(6,x.ad+1.1/(1+x.ad*.2))}});
  G.nat+=.08;
  const m='Программная речь: '+ISSUES[issue]+'.';say(G,m);return {ok:true,msg:m};
}
function actPrep(G){
  if(G.ap<1)return fail('Нет свободных дней.');if(G.prep>=3)return fail('Вы готовы к дебатам максимально.');
  G.ap--;G.prep++;const m='Подготовка к дебатам (уровень '+G.prep+').';say(G,m);return {ok:true,msg:m};
}
function actAttack(G){
  if(G.funds<COST.attack)return fail('Не хватает средств.');
  G.funds-=COST.attack;
  if(Math.random()<.65){G.nat+=.7;const m='Атакующая реклама сработала: рейтинг соперника просел.';say(G,m);return {ok:true,msg:m}}
  G.nat-=.5*mult(G,'crisis');const m='Атака обернулась против вас: избиратели недовольны негативом.';say(G,m);return {ok:true,msg:m};
}
function actTrack(G,code){
  const s=S[code],t=G.polls.track[code];
  if(t&&t.w===G.week)return fail('Опрос по этому штату уже заказан на этой неделе.');
  if(G.funds<COST.track)return fail('Не хватает средств.');
  G.funds-=COST.track;
  G.polls.track[code]={v:pollValue(G,s,SRCB.track,margin(G,s),null),w:G.week};
  const m='Заказан свежий опрос: '+s.name+'.';say(G,m);return {ok:true,msg:m};
}
function opponentTurn(G){
  const d=DIFF[G.diff],oe=G.opEff,wl=11-G.week;
  let days=G.week===10?4:3,total=0;
  const noise={};STATES.forEach(s=>noise[s.code]=gauss()*1.8);
  const view=s=>margin(G,s)+noise[s.code];
  const dens=m=>Math.exp(-m*m/72);
  const did={ad:[],field:[],rally:[]};
  /* дебаты и деньги */
  if((G.week===4||G.week===7)&&days>0){G.opPrep=Math.min(3,G.opPrep+1);days--;say(G,'Соперник готовится к дебатам.')}
  let raised=0;
  while(G.opFunds<14&&days>0&&G.week<9&&raised<2){const g=7*Math.sqrt(oe)*(raised?.6:1);G.opFunds+=g;days--;raised++}
  if(raised)say(G,'Соперник проводит сборы средств.');
  const budget=G.week>=10?G.opFunds:Math.min(G.opFunds,G.opFunds/wl*(wl>3?1.3:1.6));
  let spent=0,atk=false;
  for(let it=0;it<16;it++){
    let best=null;
    const consider=o=>{if(o.cost<=budget-spent+1e-9&&o.cost<=G.opFunds+1e-9&&o.val>.12&&(!best||o.val>best.val))best=o};
    let tot=0;
    STATES.forEach(s=>{
      const m=view(s),ev=s.ev*dens(m),x=G.st[s.code],ac=adCost(s);tot+=ev;
      consider({k:'ad',s,cost:ac,val:ev*2*oe/(1+x.opAd*.25)/ac});
      if(x.opGround<3)consider({k:'field',s,cost:3.5,val:ev*.6*oe*Math.min(wl,6)*.8/3.5});
      if(days>0)consider({k:'rally',s,cost:1.5,val:ev*(1/(1+x.opRal*.5))*oe*(.7*Math.min(wl,6)*.7+1.5)/3.5});
    });
    if(!atk&&G.week>=2&&G.week-G.opLastAtk>=3)consider({k:'atk',cost:8,val:tot*.28*oe/8*.6});
    if(!best)break;
    G.opFunds-=best.cost;spent+=best.cost;
    const s=best.s,x=s?G.st[s.code]:null;
    if(best.k==='ad'){x.opAd=Math.min(6,x.opAd+2*oe/(1+x.opAd*.25));did.ad.push(s.code)}
    else if(best.k==='field'){x.opGround++;did.field.push(s.code)}
    else if(best.k==='rally'){
      days--;const k=oe/(1+x.opRal*.5);
      x.persist=Math.max(-6,x.persist-.7*k);x.opAd=Math.min(6,x.opAd+1.5*k);x.opRal++;
      STATES.forEach(o=>{if(o.region===s.region&&o.code!==s.code)G.st[o.code].persist=Math.max(-6,G.st[o.code].persist-.12*k)});
      did.rally.push(s.code);
    }else{atk=true;G.opLastAtk=G.week;
      if(Math.random()<.65){G.nat-=.7;say(G,'Соперник запустил атакующий ролик против вас.')}
      else{G.nat+=.5;say(G,'Атака соперника на вас обернулась против него самого.')}
    }
  }
  total=spent;
  const uniq=a=>a.filter((c,i)=>a.indexOf(c)===i).join(', ');
  const parts=[];
  if(did.ad.length)parts.push('реклама: '+uniq(did.ad));
  if(did.field.length)parts.push('новые штабы: '+uniq(did.field));
  if(did.rally.length)parts.push('митинги: '+uniq(did.rally));
  say(G,parts.length?'Лагерь соперника — '+parts.join('; ')+'.':'Соперник экономит деньги на этой неделе.');
  /* случайные события в лагере соперника */
  if(Math.random()<.32){
    const good=Math.random()<.5+(oe-1)*.3;
    if(good){G.nat-=rnd(.2,.45);say(G,pick(['Соперник удачно выступил в прямом эфире, его рейтинг растёт.','Крупная ассоциация объявила о поддержке соперника.','Соперник собрал большую аудиторию на митинге.']))}
    else{G.nat+=rnd(.2,.4);say(G,pick(['Соперник оговорился на встрече с избирателями.','В штабе соперника разгорелся кадровый скандал.','Соперник провалил интервью, пресса пишет об этом.']))}
  }
  G.opLastSpent=total;G.opSeen=Math.round(total*rnd(.8,1.25));
}
function endWeek(G){
  opponentTurn(G);
  STATES.forEach(s=>{const x=G.st[s.code];x.ad*=.75;x.opAd*=.75});
  G.funds+=14*mult(G,'income');
  G.opFunds+=DIFF[G.diff].oi*(1+clamp(-G.nat/10,-.2,.2));
  G.log.unshift({w:G.week,items:G.weekLog.slice()});G.log=G.log.slice(0,4);G.weekLog=[];
  if(G.week===10)G.finalPolls=finalPollRows(G);
  G.week++;
  if(G.week>10){startNight(G);return}
  startWeek(G);
}
function startWeek(G){
  G.ap=G.week===10?4:3;G.fundraised=0;pollsRefresh(G);G.pending=null;
  if(G.week===5||G.week===8){
    const ks=['attack','policy','charm'],op=pick(ks);
    const hint=Math.random()<(G.team.includes('strategist')?.8:.5)?op:pick(ks.filter(k=>k!==op));
    G.pending={type:'debate',n:G.week===5?1:2,op,hint,out:null};
  }else if(G.evPlan[G.week])G.pending={type:'event',id:G.evPlan[G.week],out:null};
  if(!G.sel)G.sel=suggest(G)[0].code;
}

function doDebate(G,k){
  const p=G.pending;
  const stat=k==='attack'?G.stats.resilience:k==='policy'?G.stats.policy:G.stats.charisma;
  let mine=stat+(G.vp?G.vp.deb:0)+G.prep*.7+(G.team.includes('coach')?mult(G,'debate'):0)+gauss()*1.1;
  let rps=0;if(BEATS[k]===p.op)rps=2;else if(BEATS[p.op]===k)rps=-2;
  mine+=rps;
  const theirs=6.2+DIFF[G.diff].op*.6-.4+G.opPrep*.5+gauss()*1.1;
  const d=mine-theirs;
  G.nat+=clamp(d*.2,-1.5,1.5);if(d>0)G.funds+=5;
  G.prep=0;G.opPrep=0;
  G.debates.push({n:p.n,k,op:p.op,d,won:d>0});
  p.out={d,rps,text:d>1.5?'Уверенная победа. Рейтинги пошли вверх.':d>0?'Вы чуть сильнее соперника.':d>-1.5?'Небольшой проигрыш: соперник выглядел увереннее.':'Тяжёлый вечер. Соперник вас переиграл.'};
  say(G,'Дебаты №'+p.n+': '+(d>0?'победа':'поражение')+'.');
}

function computeElection(G){
  const natErr=gauss()*1.6,reg={};REGIONS.forEach(r=>reg[r]=gauss()*1.4);
  const res={};let me=0,op=0,pop=0;
  STATES.forEach(s=>{
    const m=margin(G,s)+natErr+reg[s.region]+gauss()*1.5;
    res[s.code]={m,win:m>0};if(m>0)me+=s.ev;else op+=s.ev;pop+=s.ev*m;
  });
  let tie=false,winner=me>=270?'me':'op';
  if(me===269){tie=true;winner=Math.random()<.5?'me':'op'}
  return {res,me,op,tie,winner,pop:pop/538};
}
function startNight(G){
  G.final=computeElection(G);
  G.night={order:REGIONS.flatMap(r=>STATES.filter(s=>s.region===r).sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(s=>s.code)),i:0};
  G.phase='night';
}

}
function viewResult(){
  const f=G.final,won=f.winner==='me';
  const close=STATES.slice().sort((a,b)=>Math.abs(f.res[a.code].m)-Math.abs(f.res[b.code].m)).slice(0,5);
  const tiles=STATES.map(s=>{const m=f.res[s.code].m,a=Math.abs(m),party=(m>0?G.side:G.opSide).toLowerCase();return tileHTML(s,party+(a<3?1:a<8?2:3),'',false)}).join('');
  const deb=G.debates.map(d=>'№'+d.n+': '+(d.won?'победа':'поражение')).join(', ')||'не было';
  const pop=G.dir*0;
  return '<div class="stack">'+chy('Итоги выборов','<span>'+(f.tie?'Ничья 269:269. Решение Палаты представителей.':'Голоса выборщиков подсчитаны')+'</span>')
   +'<h1 style="font-size:clamp(46px,11vw,96px);color:'+(won?'var(--good)':'var(--bad)')+'">'+(won?'Победа':'Поражение')+'</h1>'
   +'<p style="font-size:18px;max-width:60ch">'+(won?esc(G.me.name)+' становится президентом: <b>'+f.me+'</b> голосов выборщиков против <b>'+f.op+'</b>.':'Президентом становится соперник: <b>'+f.op+'</b> голосов против <b>'+f.me+'</b> у вас.')+' Разрыв по голосам избирателей: '+sgn(f.pop)+' п. п. (оценка).</p>'
   +'<div class="map" role="img" aria-label="Итоговая карта">'+tiles+'</div>'+legend()
   +'<div class="grid"><div class="card"><div class="lbl" style="margin-bottom:6px">Самые тесные штаты</div>'+close.map(s=>'<div class="kv"><span>'+s.name+' ('+s.ev+')</span><span class="mono">'+(f.res[s.code].win?'вы ':'соперник ')+sgn(Math.abs(f.res[s.code].m))+'</span></div>').join('')+'</div>'
   +'<div class="card"><div class="lbl" style="margin-bottom:6px">Ваша кампания</div><div class="kv"><span>Темы</span><span style="text-align:right">'+G.me.accents.map(a=>ISSUES[a]).join(', ')+'</span></div><div class="kv"><span>Позиция</span><span>'+posLabel(G.me.pos)+'</span></div><div class="kv"><span>Команда</span><span style="text-align:right">'+G.team.map(i=>ADV[i].role).join(', ')+'</span></div><div class="kv"><span>Напарник</span><span>'+G.vp.name+'</span></div><div class="kv"><span>Дебаты</span><span>'+deb+'</span></div></div>'
    +'<div class="card"><div class="lbl" style="margin-bottom:6px">Что показывали опросы в последнюю неделю</div><p class="hint" style="margin-bottom:6px">Вы · неясно · соперник</p>'+(G.finalPolls||[]).map(r=>'<div class="kv"><span>'+esc(r.n)+'</span><span class="mono">'+r.me+' · '+r.q+' · '+r.op+'</span></div>').join('')+'<div class="kv"><span><b>Итог</b></span><span class="mono"><b>'+f.me+' · 0 · '+f.op+'</b></span></div><p class="hint" style="margin-top:8px">Общий сдвиг опросов: '+(G.pollBias>0?'завышали ваши шансы':'занижали ваши шансы')+' примерно на '+f1(Math.abs(G.pollBias))+' п. п.</p></div></div>'
   +'<div class="row"><button class="btn pri big" data-act="again">Сыграть снова</button></div></div>';
}

function view(){
  if(!G)return viewTitle();
  switch(G.phase){
    case'setup':return viewSetup();case'plan':return viewPlan();case'stageRes':return viewStageRes();case'hire':return viewHire();
    case'convention':return viewConv();case'convDone':return viewConvDone();case'out':return viewOut();case'vp':return viewVP();
    case'general':return viewGeneral();case'night':return viewNight();case'result':return viewResult();
  }
  return '';
}
function render(keep){
  const y=window.scrollY;
  app.dataset.side=G?G.side:UI.side;
  app.innerHTML=view();
  window.scrollTo(0,keep?y:0);
}
function flash(r){if(r&&!r.ok&&G){G.flash=r.msg}}
const H={
  side:d=>{UI.side=d.v;render(true)},
  diff:d=>{UI.diff=d.v;render(true)},
  start:()=>{G=newGame(UI.side,UI.diff);render()},
  acc:d=>{const a=G.ui.acc,i=a.indexOf(d.v);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(d.v);render(true)},
  adv:d=>{const a=G.ui.hire,i=a.indexOf(d.v);if(i>=0)a.splice(i,1);else if(a.length<2)a.push(d.v);render(true)},
  begin:()=>{setupPrimaries(G,G.ui);render()},
  tone:d=>{G.plan.tone=+d.v;render(true)},
  theme:d=>{G.plan.theme=G.plan.theme===d.v?null:d.v;render(true)},
  region:d=>{G.plan.region=G.plan.region===d.v?null:d.v;render(true)},
  tgt:d=>{G.plan.target=d.v;render(true)},
  tac:d=>{const t=G.plan.tactics,i=t.indexOf(d.v);if(i>=0)t.splice(i,1);else if(t.length<2)t.push(d.v);render(true)},
  runstage:()=>{resolveStage(G);render()},
  next:()=>{
    if(G.stageIdx>=5){G.phase='convention'}else if(G.needHire){G.phase='hire'}else{G.phase='plan';beginPlan(G)}
    render();
  },
  hire:d=>{hireAdv(G,d.v);render()},
  conv:d=>{convChoose(G,d.v);render()},
  tovp:()=>{G.phase='vp';render()},
  vp:d=>{pickVP(G,d.v);render()},
  sel:d=>{G.sel=d.v;render(true)},
  ad:()=>{flash(actAd(G,G.sel));render(true)},
  rally:()=>{flash(actRally(G,G.sel));render(true)},
  field:()=>{flash(actField(G,G.sel));render(true)},
  fund:()=>{flash(actFund(G));render(true)},
  speech:d=>{flash(actSpeech(G,d.v));render(true)},
  prep:()=>{flash(actPrep(G));render(true)},
  attack:()=>{flash(actAttack(G));render(true)},
  track:()=>{flash(actTrack(G,G.sel));render(true)},
  view:d=>{G.view=d.v;render(true)},
  endweek:()=>{endWeek(G);if(G.phase==='night'){runNight()}render()},
  evt:d=>{chooseEvent(G,+d.v);render(true)},
  deb:d=>{doDebate(G,d.v);render(true)},
  dismiss:()=>{dismiss(G);render(true)},
  skip:()=>{stopNight();G.phase='result';render()},
  again:()=>{stopNight();G=null;render()}
};
function stopNight(){if(timer){clearInterval(timer);timer=null}}
function runNight(){
  stopNight();
  timer=setInterval(()=>{
    if(!G||G.phase!=='night'){stopNight();return}
    G.night.i++;
    if(G.night.i>=G.night.order.length){stopNight();G.phase='result';render();return}
    render(true);
  },240);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const h=H[el.dataset.act];if(h)h(el.dataset);
});
document.addEventListener('input',e=>{
  if(e.target.id==='pos'&&G){G.ui.pos=+e.target.value;const l=document.getElementById('posL');if(l)l.textContent=posLabel(G.ui.pos)}
});
render();
})();
</script>

</body></html>
