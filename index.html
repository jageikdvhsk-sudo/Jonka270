const STATES=RAW.map(r=>({code:r[0],name:r[1],ev:r[2],lean:r[0]==='DC'?r[3]:r[3]+1.5,region:r[4],issues:r[5].split(','),row:r[6],col:r[7],note:STATE_NOTES[r[0]]||''}));
const S={};STATES.forEach(s=>S[s.code]=s);
const REGIONS=['NE','SE','MW','SW','W','PAC'];
function regionShare(id,reg){let a=0,b=0;STATES.forEach(s=>{if(stageOf(s.code)===id){b+=s.ev;if(s.region===reg)a+=s.ev}});return b?a/b:0}
const regionEffect=(id,reg)=>{const sh=regionShare(id,reg);return .7*sh-.3*(1-sh)};

/* ================= localStorage ================= */
function loadAch(){try{return JSON.parse(localStorage.getItem('g270_ach')||'{}')}catch(e){return{}}}
function saveAch(id){try{const a=loadAch();a[id]=true;localStorage.setItem('g270_ach',JSON.stringify(a))}catch(e){}}
function grantAch(G,id){
  if(!G||G.ach[id])return false;
  G.ach[id]=true;saveAch(id);G.score+=25;
  (G.achToast=G.achToast||[]).push(id);
  return true;
}
function loadLB(){try{return JSON.parse(localStorage.getItem('g270_lb')||'[]')}catch(e){return[]}}
function saveLB(e){try{const l=loadLB();l.push(e);l.sort((a,b)=>b.score-a.score);localStorage.setItem('g270_lb',JSON.stringify(l.slice(0,75)))}catch(e){}}
function loadStats(){try{return JSON.parse(localStorage.getItem('g270_stats')||'{}')}catch(e){return{}}}
function saveStats(s){try{localStorage.setItem('g270_stats',JSON.stringify(s))}catch(e){}}
function bumpStats(G,fs){
  const s=loadStats();
  s.games=(s.games||0)+1;
  if(G.final.winner==='me')s.wins=(s.wins||0)+1;else s.losses=(s.losses||0)+1;
  s.byDiff=s.byDiff||{easy:{g:0,w:0},normal:{g:0,w:0},hard:{g:0,w:0}};
  s.byDiff[G.diff].g++;if(G.final.winner==='me')s.byDiff[G.diff].w++;
  s.byParty=s.byParty||{D:{g:0,w:0},R:{g:0,w:0}};
  s.byParty[G.side].g++;if(G.final.winner==='me')s.byParty[G.side].w++;
  s.evTotal=(s.evTotal||0)+G.final.me;
  s.evWon=(s.evWon||0)+(G.final.winner==='me'?G.final.me:0);
  s.popSum=(s.popSum||0)+G.final.pop;
  s.bestScore=Math.max(s.bestScore||0,fs);
  s.scoreSum=(s.scoreSum||0)+fs;
  s.delegates=(s.delegates||0)+G.me.del;
  s.debates=s.debates||{w:0,l:0};
  G.debates.forEach(d=>{if(d.won)s.debates.w++;else s.debates.l++});
  s.stageWins=(s.stageWins||0)+(G.stageWins?G.stageWins.length:0);
  s.backrooms=(s.backrooms||0)+Object.keys(G.backroomsUsed||{}).length;
  s.lastPlayed=Date.now();
  saveStats(s);
  return s;
}
function finalScore(G){
  if(!G)return 0;
  const f=G.final;
  let s=G.score||0;
  if(f){
    s+=f.me*3;
    if(f.winner==='me')s+=500;
    if(f.pop>0)s+=100;
  }
  const d=G.diff==='easy'?.75:G.diff==='hard'?1.5:1;
  return Math.round(s*d);
}
function achCount(){const a=loadAch();return ACHS.filter(x=>a[x.id]).length}

/* ================= праймериз ================= */
function mult(G,k){let m=1;G.team.forEach(id=>{const f=ADV[id].fx[k];if(f)m*=f});const pf=G.pfx&&G.pfx[k];if(pf)m*=pf;return m}
function newGame(side,diff){
  const me={id:'me',name:'',tag:'Вы',pos:BASE_POS,accents:[],mo:0,charisma:5,home:1,homeState:'',del:0,out:false,isMe:true,perk:[]};
  const rivals=RIVALS[side].map(r=>Object.assign({},r,{accents:r.accents.slice(),mo:0,del:0,out:false}));
  return {side,opSide:side==='D'?'R':'D',diff,phase:'editor',me,rivals,
    stats:Object.assign({},BASE_STATS),funds:BASE_FUNDS,team:[],stageIdx:0,unity:0,needHire:false,
    pfx:{},var:1,
    score:0,ach:{},stageWins:[],backroomsUsed:{},wasBehindAtStage3:false,
    campaignSpent:0,scoreSaved:false,achToast:[],
    ui:{acc:[],pos:BASE_POS,hire:[],recAccents:[],perks:[],
        profile:{name:'',birthState:'',edu:'',social:'',job:'',facts:[],character:''}},
    plan:{tone:0,tactics:[]},estNoise:{},lastRes:null,convOut:null,vp:null,vpDeal:null,debates:[],
    stat:{ads:0,field:0,rally:0},stateRes:{},stageDel:{}};
}
function setupPrimaries(G,o){
  G.me.accents=o.acc.slice();G.me.pos=o.pos;G.team=o.hire.slice();
  G.phase='plan';beginPlan(G);
}
function activeCands(G){return [G.me].concat(G.rivals.filter(r=>!r.out))}
function themeBonus(G,c,issue,st){
  const base=PARTIES[G.side].base[issue]||0;
  return (.25+.45*base)*(st.hot.indexOf(issue)>=0?1.3:.6)*(c.accents.indexOf(issue)>=0?1.15:.75)*.65;
}
function beginPlan(G){
  G.plan={tone:0,tactics:[],theme:null,region:null,target:null,backroom:null};G.estNoise={};
  activeCands(G).forEach(c=>G.estNoise[c.id]=gauss()*.55*(c.isMe&&G.team.includes('strategist')?.6:1));
}
function baseScore(G,c,st){
  const party=PARTIES[G.side];
  const posFit=1-Math.abs(c.pos-st.ep)/60;
  let fit=0;c.accents.forEach(a=>{fit+=(party.base[a]||0)*(st.hot.includes(a)?1.5:1)});fit/=3;
  let s=2.4*posFit+2.2*fit+.12*c.charisma+.9*c.mo+(c.home===st.id?.55:0);
  if(c.isMe&&G.team.includes('strategist'))s+=.35*fit;
  if(!c.isMe)s+=DIFF[G.diff].riv;
  return s;
}
const softShares=sc=>{const T=1.5,ex=sc.map(s=>Math.exp(s/T)),t=sum(ex);return ex.map(e=>e/t)};
const threshold=sh=>{const r=sh.map(v=>v<.15?0:v),t=sum(r);return t===0?sh:r.map(v=>v/t)};
function allocate(sh,total){
  const raw=sh.map(s=>s*total),fl=raw.map(Math.floor);let rem=total-sum(fl);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){fl[i]++;rem--}});
  return fl;
}
function estimate(G){
  const st=STAGES[G.stageIdx],cs=activeCands(G);
  const sh=threshold(softShares(cs.map(c=>baseScore(G,c,st)+(G.estNoise[c.id]||0))));
  return cs.map((c,i)=>({c,share:sh[i]}));
}
function planCost(G){return sum(G.plan.tactics.map(k=>TACT[k].cost))+(G.plan.region?REG_COST:0)+(G.plan.backroom?BKMAP[G.plan.backroom].cost:0)}
function resolveStage(G){
  const st=STAGES[G.stageIdx],plan=G.plan,notes=[];
  G.me.pos=clamp(G.me.pos+plan.tone*8,5,95);
  const tc=plan.tactics.slice(0,2);
  const regCost=plan.region?REG_COST:0;
  G.funds-=sum(tc.map(k=>TACT[k].cost))+regCost;
  tc.forEach(k=>{if(k==='ads')G.stat.ads++;if(k==='ground')G.stat.field++;if(k==='rally')G.stat.rally++});
  const cs=activeCands(G),bonus={};cs.forEach(c=>bonus[c.id]=0);
  const others=cs.filter(c=>!c.isMe);
  const rank=c=>c.del+c.mo*20;
  const leader=others.slice().sort((a,b)=>rank(b)-rank(a))[0];
  const tgt=others.find(r=>r.id===plan.target)||leader;
  tc.forEach(k=>{
    if(k==='attack'){
      if(tgt){bonus[tgt.id]-=.9;G.unity-=.25;
        if(Math.random()<.25*mult(G,'crisis')+.1){bonus.me-=.5;notes.push('Негативная кампания обернулась против вас: избиратели устали от грязи.')}
        else notes.push('Ваша атака на '+tgt.name+' попала в цель.');}
    }else if(k==='oppo'){
      if(tgt){
        if(Math.random()<.65){bonus[tgt.id]-=1.1;notes.push('Досье на '+tgt.name+' сработало: пресса обсуждает его прошлое.')}
        else{bonus.me-=.3*mult(G,'crisis');notes.push('Досье на '+tgt.name+' оказалось пустышкой, а утечка ударила по вам.')}
      }
    }else if(k==='fund'){
      const g=7*mult(G,'fundraise');G.funds+=g;notes.push('Сбор средств принёс '+money(g)+'.');
    }else if(k==='debate'){
      const e=((G.stats.charisma+G.stats.policy)/2-6.5)*.3+gauss()*.7*(G.var||1);
      const v=clamp(e,-.8,1.3)*XW[st.id].debate;
      bonus.me+=v>0?v*mult(G,'debate'):v;
      notes.push(v>.5?'Вы убедительно выступили на теледебатах.':v>0?'Дебаты прошли ровно, вы чуть опередили соперников.':'Дебаты прошли неудачно: вы выглядели неуверенно.');
    }else if(k==='endorse'){
      bonus.me+=TACT.endorse.v*XW[st.id].endorse;
      notes.push(pick(['Вас поддержали местные профсоюзы.','За вас высказался влиятельный губернатор.','Крупная общественная организация выступила в вашу пользу.']));
    }else bonus.me+=TACT[k].v*st.w[k]*mult(G,k);
  });
  if(plan.theme){
    bonus.me+=themeBonus(G,G.me,plan.theme,st)*mult(G,'accent');
    notes.push('Тема этапа «'+ISSUES[plan.theme]+'» '+(st.hot.indexOf(plan.theme)>=0?'попала в повестку избирателей.':'вызвала умеренный интерес.'));
  }
  if(plan.region){
    const e=regionEffect(st.id,plan.region);bonus.me+=e;
    notes.push('Региональный акцент: '+RN[plan.region]+(e>0?'. Расчёт оправдался.':'. Для этого этапа регион был слишком мал.'));
  }
  if(plan.backroom){
    const bk=BKMAP[plan.backroom];
    G.funds-=bk.cost;
    if(plan.backroom==='elders'){
      const roll=Math.random()+.08*(G.me.del/200);
      if(roll<.5){
        bonus.me+=rnd(.7,1.4);
        const victim=others.length?others[Math.floor(Math.random()*others.length)]:null;
        if(victim)bonus[victim.id]-=rnd(.3,.8);
        notes.push('Старейшины партии благосклонно выслушали вас. В кулуарах заговорили о вашей неизбежности.');
      }else if(roll<.8){
        bonus.me+=rnd(.2,.6);
        notes.push('Разговор со старейшинами прошёл ровно. Обещали подумать.');
      }else{
        bonus.me-=rnd(.1,.4);
        notes.push('Старейшины приняли вас холодно: разговоры о вашей неопытности возобновились.');
      }
    }else if(plan.backroom==='faction'){
      const victim=(plan.target&&others.find(r=>r.id===plan.target))||others.slice().sort((a,b)=>rank(b)-rank(a))[0];
      if(victim){
        const roll=Math.random();
        if(roll<.55){
          bonus.me+=rnd(.6,1.1);bonus[victim.id]-=rnd(.8,1.4);G.unity-=.1;
          notes.push('Фракция '+victim.name+' приняла ваши условия. Часть её делегатов склонилась к вам, но в штабе соперника об этом догадываются.');
        }else if(roll<.8){
          bonus.me+=rnd(.2,.5);
          notes.push('Переговоры с фракцией '+victim.name+' идут трудно. Пока лишь намёки.');
        }else{
          G.unity-=.15;bonus.me-=rnd(.2,.5);
          notes.push('Сделка с фракцией '+victim.name+' дала течь: в прессе пишут о ваших закулисных обещаниях.');
        }
      }
    }else if(plan.backroom==='whisper'){
      const victim=others.length?others[Math.floor(Math.random()*others.length)]:null;
      if(victim){
        const roll=Math.random()+(G.team.includes('crisis')?.1:0);
        if(roll<.5){
          bonus[victim.id]-=rnd(.9,1.6);
          notes.push('Слух о '+victim.name+' разошёлся по редакциям. Следов не осталось.');
        }else if(roll<.78){
          bonus[victim.id]-=rnd(.4,.8);bonus.me-=rnd(.1,.3);
          notes.push('Слухи о '+victim.name+' обсуждают, но и ваше имя упоминают в связи с утечкой.');
        }else{
          bonus.me-=rnd(.6,1.1);G.unity-=.2;
          notes.push('Утечка вернулась к вам: журналисты нашли источник. Скандал в вашем штабе.');
        }
      }
    }
  }
  others.forEach(r=>{
    let eff=0;
    shuffle(['ads','ground','rally']).slice(0,2).forEach(k=>{const t=TACT[k];if(r.money>=t.cost){r.money-=t.cost;eff+=t.v*st.w[k]}});
    bonus[r.id]+=eff*.85;
    bonus[r.id]+=Math.max.apply(null,r.accents.map(a=>themeBonus(G,r,a,st)))*.9;
    if(r.money>=5&&Math.random()<.28){
      const tg=cs.filter(c=>c.id!==r.id).sort((a,b)=>rank(b)-rank(a))[0];
      if(tg){r.money-=5;bonus[tg.id]-=.8;if(tg.isMe)notes.push(r.name+' запустил против вас негативную рекламу.')}
    }
  });
  const sc=cs.map(c=>baseScore(G,c,st)+bonus[c.id]+gauss()*.45*(c.isMe?(G.var||1):1));
  const sh=threshold(softShares(sc));
  const dels=allocate(sh,st.del);
  const rows=cs.map((c,i)=>{c.del+=dels[i];return {c,share:sh[i],got:dels[i]}});
  rows.forEach(r=>{r.c.mo=clamp(.5*r.c.mo+(r.share-1/cs.length)*2.4,-1.5,1.5)});
  const mine=rows.find(r=>r.c.isMe);
  const inc=(4+mine.share*12)*mult(G,'income');
  G.funds+=inc;
  others.forEach(r=>{const row=rows.find(x=>x.c===r);r.money+=4+row.share*10});
  const winner=rows.slice().sort((a,b)=>b.share-a.share)[0];
  notes.unshift(winner.c.isMe?'Вы выигрываете этап.':winner.c.name+' выигрывает этап.');
  const total=sum(activeAll(G).map(c=>c.del));
  if(G.stageIdx>=2){
    G.rivals.forEach(r=>{
      if(!r.out&&r.del/total<.14){
        r.out=true;notes.push(r.name+' снимает кандидатуру.');
        const rem=activeCands(G).sort((a,b)=>Math.abs(a.pos-r.pos)-Math.abs(b.pos-r.pos))[0];
        if(rem){rem.mo=clamp(rem.mo+.5,-1.5,1.5);if(rem.isMe)notes.push('Сторонники '+r.name+' переходят к вам.')}
      }
    });
  }
  /* очки и достижения за этап */
  G.score+=mine.got;
  if(winner.c.isMe){
    G.stageWins.push(st.id);
    G.score+=50+(st.id>=4?50:0);
    grantAch(G,'first_step');
    if(st.id===1)grantAch(G,'iowa_dawn');
    if(st.id===4)grantAch(G,'super_tuesday');
    if(st.id===5)grantAch(G,'finisher');
    if(st.id===1&&winner.share>.5)grantAch(G,'caucus_master');
    if(G.stageWins.length===5)grantAch(G,'sweep');
  }
  if(st.id===3){
    const rivalsDel=Math.max.apply(null,G.rivals.map(r=>r.del));
    if(G.me.del<rivalsDel)G.wasBehindAtStage3=true;
  }
  if(plan.backroom){
    G.backroomsUsed[plan.backroom]=true;
    if(Object.keys(G.backroomsUsed).length>=3)grantAch(G,'backroom_master');
  }
  const sres={};
  STATES.forEach(s=>{
    if(stageOf(s.code)!==st.id)return;
    let bi=0,bv=-9;cs.forEach((c,i)=>{const v=sh[i]+gauss()*.07;if(v>bv){bv=v;bi=i}});
    sres[s.code]=cs[bi].id;
  });
  G.stateRes=Object.assign(G.stateRes||{},sres);
  G.stageDel=G.stageDel||{};G.stageDel[st.id]=rows.map(r=>({id:r.c.id,got:r.got}));
  G.lastRes={stage:st,rows:rows.map(r=>({c:r.c,share:r.share,got:r.got,cum:r.c.del})),notes,inc,spent:sum(tc.map(k=>TACT[k].cost))+regCost+(plan.backroom?BKMAP[plan.backroom].cost:0),total};
  G.stageIdx++;
  G.needHire=(G.stageIdx===2||G.stageIdx===4)&&G.team.length<5;
  G.phase='stageRes';
  return G.lastRes;
}
const activeAll=G=>[G.me].concat(G.rivals);
function hireAdv(G,id){G.team.push(id);G.needHire=false;G.phase='plan';beginPlan(G)}

/* ---- съезд ---- */
function convStatus(G){
  const all=activeAll(G),total=sum(all.map(c=>c.del)),maj=Math.floor(total/2)+1;
  const rivals=G.rivals.slice().sort((a,b)=>b.del-a.del);
  const best=rivals[0];
  const kind=G.me.del>=maj?'majority':G.me.del>best.del?'lead':'trail';
  return {total,maj,kind,best,second:rivals[1]};
}
function adoptAccent(G,rv){
  const party=PARTIES[G.side];
  const cand=rv.accents.find(a=>!G.me.accents.includes(a));
  if(!cand)return;

const SRC=[

function opponentTurn(G){

  let spent=0,atk=false;

    let best=null;
    const consider=o=>{if(o.cost<=budget-spent+1e-9&&o.cost<=G.opFunds+1e-9&&o.val>.12&&(!best||o.val>best.val))best=o};
    let tot=0;

      const m=view(s),ev=s.ev*dens(m),x=G.st[s.code],ac=adCost(s);tot+=ev;

    });
    if(!atk&&G.week>=2&&G.week-G.opLastAtk>=3)consider({k:'atk',cost:8,val:tot*.28*oe/8*.6});
    if(!best)break;

    const s=best.s,x=s?G.st[s.code]:null;
    if(best.k==='ad'){x.opAd=Math.min(6,x.opAd+2*oe/(1+x.opAd*.25));did.ad.push(s.code)}
    else if(best.k==='field'){x.opGround++;did.field.push(s.code)}

      days--;const k=oe/(1+x.opRal*.5);

      did.rally.push(s.code);
    }else{atk=true;G.opLastAtk=G.week;

      else{G.nat+=.5;say(G,'Атака соперника на вас обернулась против него самого.')}
    }
  }

  const uniq=a=>a.filter((c,i)=>a.indexOf(c)===i).join(', ');

const DEB={attack:{n:'Атаковать',d:'Давить на слабые места. Ваш козырь: стойкость.'},policy:{n:'Говорить по существу',d:'Цифры и планы. Ваш козырь: знание политики.'},charm:{n:'Рассказывать истории',d:'Эмоции и личный образ. Ваш козырь: харизма.'}};
const BEATS={attack:'charm',policy:'attack',charm:'policy'};
function doDebate(G,k){
  const p=G.pending;
  let stat=k==='attack'?G.stats.resilience:k==='policy'?G.stats.policy:G.stats.charisma;
  if(k==='attack'&&G.pfx&&G.pfx.debateAttack)stat*=G.pfx.debateAttack;
  if(k==='policy'&&G.pfx&&G.pfx.debatePolicy)stat*=G.pfx.debatePolicy;
  if(k==='charm'&&G.pfx&&G.pfx.debateCharm)stat*=G.pfx.debateCharm;
  let mine=stat+(G.vp?G.vp.deb:0)+G.prep*.7+(G.team.includes('coach')?mult(G,'debate'):0)+gauss()*1.1*(G.var||1);
  let rps=0;if(BEATS[k]===p.op)rps=2;else if(BEATS[p.op]===k)rps=-2;
  mine+=rps;
  const theirs=6.2+DIFF[G.diff].op*.6-.4+G.opPrep*.5+gauss()*1.1;
  const d=mine-theirs;
  G.nat+=clamp(d*.2,-1.5,1.5);if(d>0)G.funds+=5;
  G.prep=0;G.opPrep=0;
  G.debates.push({n:p.n,k,op:p.op,d,won:d>0});
  if(d>0)G.score+=30;
  if(d>2.5)grantAch(G,'orator');
  p.out={d,rps,text:d>1.5?'Уверенная победа. Рейтинги пошли вверх.':d>0?'Вы чуть сильнее соперника.':d>-1.5?'Небольшой проигрыш: соперник выглядел увереннее.':'Тяжёлый вечер. Соперник вас переиграл.'};
  say(G,'Дебаты №'+p.n+': '+(d>0?'победа':'поражение')+'.');
}
const dismiss=G=>{G.pending=null};

/* ---- финальные достижения ---- */
function checkFinalAch(G){
  const f=G.final;if(!f)return;
  if(f.winner==='me'){
    if(G.diff==='hard')grantAch(G,'legend');
    if(f.pop>0)grantAch(G,'popular_vote');
    if(f.me>=350)grantAch(G,'landslide');
    if(f.me<280)grantAch(G,'razor_edge');
    if(G.me.homeState&&f.res[G.me.homeState].win)grantAch(G,'home_turf');
    if(['PA','MI','WI'].every(c=>f.res[c].win))grantAch(G,'rust_belt');
    if(f.res['TX'].win||f.res['FL'].win)grantAch(G,'sun_belt');
    const ne=STATES.filter(s=>s.region==='NE');
    if(ne.every(s=>f.res[s.code].win))grantAch(G,'eastern_block');
    const regs=REGIONS.filter(r=>STATES.some(s=>s.region===r&&f.res[s.code].win));
    if(regs.length===REGIONS.length)grantAch(G,'regional_sweep');
    const dl=G.debates.filter(x=>!x.won).length;
    const dw0=G.debates.filter(x=>x.won).length;
    if(dl>=2&&dw0===0)grantAch(G,'lost_debate');
    if((G.campaignSpent||0)<40)grantAch(G,'modest_budget');
  }
  const dw=G.debates.filter(x=>x.won).length;
  if(dw>=2&&G.debates.length>=2)grantAch(G,'duelist');
  const g3=Object.keys(G.st).filter(k=>G.st[k].ground>=3).length;
  if(g3>=5)grantAch(G,'field_marshal');
  const adSt=Object.keys(G.st).filter(k=>G.st[k].ad>0).length;
  if(adSt>=10)grantAch(G,'media_mogul');
  if(G.stat.rally>=5)grantAch(G,'rally_soul');
  const total=G.funds+(G.campaignSpent||0)+(G.spentPrimary||0);
  if(total>=100)grantAch(G,'money_magnet');
}

/* ---- ночь выборов ---- */
function computeElection(G){
  const natErr=gauss()*1.6,reg={};REGIONS.forEach(r=>reg[r]=gauss()*1.4);
  const res={};let me=0,op=0,pop=0;
  STATES.forEach(s=>{
    const m=margin(G,s)+natErr+reg[s.region]+gauss()*1.5;
    res[s.code]={m,win:m>0};if(m>0)me+=s.ev;else op+=s.ev;pop+=s.ev*m;
  });
  let tie=false,winner=me>=270?'me':'op';
  if(me===269){tie=true;winner=Math.random()<.5?'me':'op'}
  return {res,me,op,tie,winner,pop:pop/538};
}
function startNight(G){
  G.final=computeElection(G);
  checkFinalAch(G);
  G.night={order:REGIONS.flatMap(r=>STATES.filter(s=>s.region===r).sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(s=>s.code)),i:0};
  G.phase='night';
}

function applyEditor(G){
  const p=G.ui.profile;
  const sources=[
    EDU.find(e=>e.id===p.edu),
    CLASSES.find(c=>c.id===p.social),
    JOBS.find(j=>j.id===p.job),
    CHARS.find(c=>c.id===p.character),
    ...p.facts.map(id=>FACTS.find(f=>f.id===id))
  ].filter(Boolean);
  const stats=Object.assign({},BASE_STATS);
  let funds=BASE_FUNDS,unityBonus=0,posShift=0,variance=1;
  const fx={},perks=[],accSet=new Set();
  sources.forEach(src=>{
    if(src.stats)for(const k in src.stats)stats[k]=(stats[k]||0)+src.stats[k];
    if(src.funds)funds+=src.funds;
    if(src.fx)for(const k in src.fx)fx[k]=(fx[k]||1)*src.fx[k];
    if(src.unity)unityBonus+=src.unity;
    if(src.posShift)posShift+=src.posShift;
    if(src.variance)variance=src.variance;
    if(src.perk)perks.push(src.perk);
    if(src.acc)src.acc.forEach(a=>accSet.add(a));
  });
  for(const k in stats)stats[k]=clamp(stats[k],1,10);
  G.me.name=(p.name||'Кандидат').trim()||'Кандидат';
  G.me.homeState=p.birthState||'';
  G.me.home=p.birthState?stageOf(p.birthState):1;
  G.me.stats=stats;G.stats=stats;
  G.funds=funds;G.pfx=fx;G.var=variance;
  G.unity=clamp(unityBonus,-.3,.4);
  G.me.pos=clamp(BASE_POS+posShift,10,90);
  G.ui.pos=G.me.pos;
  G.me.charisma=stats.charisma;
  G.me.perk=perks.slice();G.ui.perks=perks.slice();
  G.ui.recAccents=[...accSet].slice(0,3);
}
function editorReady(G){
  const p=G.ui.profile;
  return !!(p.name&&p.name.trim()&&p.birthState&&p.edu&&p.social&&p.job&&p.facts.length===2&&p.character);
}

function primMapCard(cur,foc,hl){
  const done=G.stateRes||{},act=cur||hl;
  const tiles=STATES.map(s=>{
    const sid=stageOf(s.code),w=done[s.code],isCur=sid===cur||sid===hl;
    let st='grid-row:'+(s.row+1)+';grid-column:'+(s.col+1)+';',cls='tile pt';
    if(w){st+='background:'+winCol(w)+';'+(w==='me'?'':'color:#14110a;')}
    else{st+='background:'+STC[sid]+';';if(!isCur)cls+=' fut'}
    if(isCur)cls+=' cur';
    if(foc&&sid===cur&&s.region===foc)cls+=' ad';
    return '<div class="'+cls+'" style="'+st+'" title="'+esc(s.name+' · этап '+sid+' · '+(s.note||''))+'"><span>'+s.code+'</span></div>';
  }).join('');
  const seg=STAGES.map(x=>{
    const sd=G.stageDel&&G.stageDel[x.id];
    const inner=sd?sd.map(r=>'<div style="width:'+(r.got/x.del*100)+'%;background:'+winCol(r.id)+'"></div>').join(''):'<div style="width:100%;background:'+STC[x.id]+';opacity:'+(x.id===act?1:.5)+'"></div>';
    return '<div class="sg'+(x.id===act?' cur':'')+'" style="flex:'+x.del+'" title="'+esc(x.name+': '+x.del+' делегатов')+'">'+inner+'</div>';
  }).join('');
  const sw=(c,t)=>'<span class="pill"><i class="sw" style="background:'+c+'"></i>'+esc(t)+'</span>';
  const leg=[sw('var(--me)',G.me.name)].concat(G.rivals.map(r=>sw(winCol(r.id),r.name+(r.out?' (снялся)':'')))).concat([sw('#6B7BA3','ещё не голосовали')]).join(' ');
  const stl=STAGES.map(x=>{
    const sd=G.stageDel&&G.stageDel[x.id];let right=x.del+' дел.';
    if(sd){const top=sd.slice().sort((a,b)=>b.got-a.got)[0],c=activeAll(G).filter(c=>c.id===top.id)[0];right=esc(c.isMe?'Вы':c.name.split(' ')[1]||c.name)+' +'+top.got+' из '+x.del}
    return '<div class="kv"><span><i class="sw" style="background:'+STC[x.id]+'"></i>'+x.id+'. '+esc(x.name)+(x.id===act?' ◀':'')+'</span><span class="mono">'+right+'</span></div>';
  }).join('');
  let reg='';
  if(act){
    reg='<div><div class="lbl" style="margin-bottom:6px">Откуда делегаты этапа «'+esc(STAGES[act-1].name)+'»</div><div class="row" style="gap:6px">'+REGIONS.filter(r=>regionShare(act,r)>0).map(r=>'<span class="pill'+(foc===r?' me':'')+'">'+RN[r]+' '+Math.round(regionShare(act,r)*100)+'%</span>').join(' ')+'</div></div>';
  }
  return '<div class="card"><div class="lbl" style="margin-bottom:8px">Карта праймериз: кто где побеждает</div><div class="pm"><div><div class="map pmap">'+tiles+'</div><div class="row" style="margin-top:8px;gap:6px">'+leg+'</div><p class="hint" style="margin-top:6px">Раскладка по штатам примерная: итог этапа определяют делегаты.</p></div>'
   +'<div class="stack" style="gap:12px"><div><div class="lbl" style="margin-bottom:6px">Календарь: ширина = число делегатов</div><div class="sgbar">'+seg+'</div></div><div>'+stl+'</div>'+reg+'</div></div></div>';
}
function stageStatesCard(stId){

   +list.map(s=>'<div style="border-left:3px solid '+STC[stId]+';padding-left:10px;min-width:0"><b>'+esc(s.name)+'</b> <span class="mono dim">'+s.ev+'</span>'+(s.code===G.me.homeState?' <span class="pill me">родной</span>':'')+'<br><span class="hint">'+esc(s.note||'')+'</span></div>').join('')

}
function segBar(rows,total){

function candRow(c,extra){

function viewPlan(){
  const st=STAGES[G.stageIdx],est=estimate(G),cost=planCost(G);
  const total=sum(activeAll(G).map(c=>c.del));
  const tone=[[-1,'Нажать на базу','Позиция −8: ближе к партийному активу'],[0,'Держать курс','Позиция остаётся прежней'],[1,'Тянуться к центру','Позиция +8: шире аудитория, холоднее актив']].map(([v,t,d])=>
    '<button class="opt'+(G.plan.tone===v?' on':'')+'" data-act="tone" data-v="'+v+'" aria-pressed="'+(G.plan.tone===v)+'"><span class="t">'+t+'</span><span class="s">'+d+'</span></button>').join('');
  const tac=Object.keys(TACT).map(k=>{const t=TACT[k],on=G.plan.tactics.includes(k);
    const dis=!on&&(G.plan.tactics.length>=2||G.funds<cost+t.cost);
    const price=k==='fund'?'+'+money(7*mult(G,'fundraise')):t.cost?money(t.cost):'бесплатно';
    return '<button class="opt'+(on?' on':'')+'" data-act="tac" data-v="'+k+'" aria-pressed="'+on+'"'+(dis?' disabled':'')+'><span class="t">'+t.n+'</span><span class="s">'+t.d+'</span><span class="m">'+price+'</span></button>'}).join('');
  const alive=G.rivals.filter(r=>!r.out),ldr=alive.slice().sort((a,b)=>(b.del+b.mo*20)-(a.del+a.mo*20))[0];
  const needT=G.plan.tactics.some(k=>k==='attack'||k==='oppo')||G.plan.backroom==='faction';
  const tgtSel=G.plan.target||(ldr?ldr.id:null);
  const tgtHTML=needT?'<div><h3>Цель удара / сделки</h3></div><div class="grid3">'+alive.map(r=>'<button class="opt'+(tgtSel===r.id?' on':'')+'" data-act="tgt" data-v="'+r.id+'" aria-pressed="'+(tgtSel===r.id)+'"><span class="t">'+esc(r.name)+'</span><span class="s">'+esc(r.tag)+(ldr&&ldr.id===r.id?' · лидер среди соперников':'')+'</span><span class="m">'+r.del+' дел.</span></button>').join('')+'</div>':'';
  const themes=Object.keys(ISSUES).map(k=>{const on=G.plan.theme===k;
    const hint=st.hot.includes(k)?'В этом этапе тема звучит громко.':G.me.accents.includes(k)?'Ваш акцент, но не тема этапа.':'Тема не в фокусе этапа.';
    return '<button class="opt'+(on?' on':'')+'" data-act="theme" data-v="'+k+'" aria-pressed="'+on+'"><span class="t" style="font-size:16px">'+ISSUES[k]+'</span><span class="s">'+hint+'</span><span class="s">'+ISSUE_D[k]+'</span></button>'}).join('');
  const regs=REGIONS.filter(r=>regionShare(st.id,r)>0).map(r=>{const on=G.plan.region===r;
    return '<button class="opt'+(on?' on':'')+'" data-act="region" data-v="'+r+'" aria-pressed="'+on+'"'+(!on&&G.funds<cost+REG_COST?' disabled':'')+'><span class="t" style="font-size:16px">'+RN[r]+'</span><span class="s">'+Math.round(regionShare(st.id,r)*100)+'% делегатов этапа</span></button>'}).join('');
  const bk=BACKROOM.map(b=>{const on=G.plan.backroom===b.id;
    const dis=!on&&G.funds<cost+b.cost;
    return '<button class="opt'+(on?' on':'')+'" data-act="backroom" data-v="'+b.id+'" aria-pressed="'+on+'"'+(dis?' disabled':'')+'><span class="t" style="font-size:16px">'+b.n+'</span><span class="s">'+b.d+'</span><span class="m">'+money(b.cost)+' · исход непредсказуем</span></button>'}).join('');
  const rows=est.map(e=>candRow(e.c,'≈ '+Math.round(e.share*100)+'%<br><span class="hint">'+e.c.del+' дел.</span>')).join('');
  const del=activeAll(G).map(c=>({v:c.del,col:colorOf(c),n:c.name}));
  return '<div class="stack">'+chy('Этап '+st.id+' из 5','<span><b>'+st.name+'</b> · '+st.date+'</span><span>Делегатов на кону: <b>'+st.del+'</b></span><span>Фонд <b>'+money(G.funds)+'</b></span><span>Очки: <b>'+G.score+'</b></span>')
   +'<div><h2>'+st.name+'</h2><p class="dim">'+st.sub+'</p></div><p style="max-width:70ch">'+st.txt+' Горячие темы этапа: '+st.hot.map(h=>'<span class="pill gold">'+ISSUES[h]+'</span>').join(' ')+'</p>'
   +'<div class="layout"><div class="card"><div class="lbl" style="margin-bottom:6px">Опросы перед этапом (с погрешностью ±6)</div>'+rows+'</div>'
   +'<div class="card"><div class="lbl" style="margin-bottom:8px">Делегаты после '+(G.stageIdx)+' '+pl(G.stageIdx,['этапа','этапов','этапов'])+'</div>'+(total?segBar(del,Math.max(1,total)):'<p class="hint">Пока никто не получил делегатов.</p>')
   +'<p class="hint" style="margin-top:8px">Для номинации нужно более половины всех делегатов: 476 из 950.</p><div style="margin-top:12px" class="kv"><span>Ваша позиция</span><span class="pill me">'+posLabel(clamp(G.me.pos+G.plan.tone*8,5,95))+'</span></div>'
   +'<div class="kv"><span>Ваши темы</span><span style="text-align:right">'+G.me.accents.map(a=>ISSUES[a]).join(', ')+'</span></div><div class="kv"><span>Команда</span><span style="text-align:right">'+G.team.map(i=>ADV[i].role).join(', ')+'</span></div></div></div>'
   +primMapCard(st.id,G.plan.region,0)
   +stageStatesCard(st.id)

   +'<div><h3>Тема этапа <span class="mono dim" style="font-size:14px">(бесплатно, одна на выбор)</span></h3></div><div class="grid3">'+themes+'</div>'

   +'<div><h3>Тактика <span class="mono dim" style="font-size:14px">(не больше двух)</span></h3></div><div class="grid">'+tac+'</div>'+tgtHTML

   +'<div class="row"><button class="btn pri big" data-act="runstage">Провести этап</button><span class="mono dim">Затраты: '+money(cost)+'</span></div></div>';
}

   +'<div class="card"><div class="lbl">Партий сыграно</div><div class="big-n" style="font-size:52px">'+g+'</div><div class="hint" style="margin-top:4px">'+w+' побед · '+l+' поражений</div></div>'

function view(){
  if(!G){
    if(UI.view==='ach')return viewAch();
    if(UI.view==='lb')return viewLB();
    if(UI.view==='stats')return viewStats();
    return viewTitle();
  }
  switch(G.phase){
    case'editor':return viewEditor();
    case'setup':return viewSetup();
    case'plan':return viewPlan();
    case'stageRes':return viewStageRes();
    case'hire':return viewHire();
    case'convention':return viewConv();
    case'convDone':return viewConvDone();
    case'out':return viewOut();
    case'vp':return viewVP();
    case'general':return viewGeneral();
    case'night':return viewNight();
    case'result':return viewResult();
  }
  return '';
}
function toastHTML(){
  if(!G||!G.achToast||!G.achToast.length)return '';
  const id=G.achToast[0],a=ACHS.find(x=>x.id===id);
  if(!a){G.achToast=[];return ''}
  return '<div class="toast-wrap"><div class="toast"><span class="lbl" style="color:var(--gold)">Достижение открыто</span>'
   +'<h3 style="margin-top:6px">'+esc(a.n)+'</h3>'
   +'<p class="hint" style="margin-top:4px">'+esc(a.d)+'</p>'
   +'<div class="row" style="margin-top:10px"><button class="btn sm pri" data-act="ack">Ок</button></div></div></div>';
}
function render(keep){
  const y=window.scrollY;
  const ae=document.activeElement;
  const aid=ae&&ae.id?ae.id:'';
  const selStart=(ae&&ae.selectionStart!=null)?ae.selectionStart:null;
  app.dataset.side=G?G.side:UI.side;
  app.innerHTML=view()+(G?toastHTML():'');
  if(aid){
    const el=document.getElementById(aid);
    if(el){
      try{el.focus();if(selStart!=null&&el.setSelectionRange)el.setSelectionRange(selStart,selStart)}catch(e){}
    }
  }
  window.scrollTo(0,keep?y:0);
}
function flash(r){if(r&&!r.ok&&G){G.flash=r.msg}}

function stopNight(){if(timer){clearInterval(timer);timer=null}}
function runNight(){
  stopNight();
  timer=setInterval(()=>{
    if(!G||G.phase!=='night'){stopNight();return}
    G.night.i++;
    if(G.night.i>=G.night.order.length){stopNight();G.phase='result';render();return}
    render(true);
  },240);
}
document.addEventListener('click',e=>{

  const h=H[el.dataset.act];if(h)h(el.dataset);
});

  if(e.target.id==='pos'&&G){G.ui.pos=+e.target.value;const l=document.getElementById('posL');if(l)l.textContent=posLabel(G.ui.pos)}
  if(e.target.id==='pname'&&G){
    G.ui.profile.name=e.target.value;
    G.me.name=(e.target.value||'').trim()||'Кандидат';
    const btn=document.querySelector('[data-act="ednext"]');
    if(btn)btn.disabled=!editorReady(G);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='pstate'&&G){
    G.ui.profile.birthState=e.target.value;
    applyEditor(G);render(true);
  }
});
render();
})();
</script>

</body></html>
