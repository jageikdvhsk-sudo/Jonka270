name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble project from flat files
        run: |
          set -e
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/gonka270/app proj/app/src/main/res/mipmap-anydpi-v26 proj/app/src/main/res/drawable proj/app/src/main/res/values
          cp index.html proj/app/src/main/assets/index.html
          cp AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp MainActivity.java proj/app/src/main/java/com/gonka270/app/MainActivity.java
          cp ic_launcher.xml proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp ic_bg.xml ic_fg.xml proj/app/src/main/res/drawable/
          cp styles.xml proj/app/src/main/res/values/styles.xml
          cat > proj/settings.gradle <<'E'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Gonka270"
          include ':app'
          E
          cat > proj/build.gradle <<'E'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          E
          cat > proj/gradle.properties <<'E'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          E
          cat > proj/app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.gonka270.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.gonka270.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          E
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Gonka270-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
